<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>색상 코드 추출기 — HEX · RGB · HSL</title>
  <meta name="description" content="색을 선택하거나 화면에서 직접 뽑아 HEX · RGB · HSL 코드를 한 번에 확인하세요.">
  <meta property="og:title" content="색상 코드 추출기">
  <meta property="og:description" content="색을 선택하거나 화면에서 직접 뽑아 HEX · RGB · HSL 코드를 한 번에 확인하세요.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="색상 코드 추출기">
  <meta name="twitter:description" content="색을 선택하거나 화면에서 직접 뽑아 HEX · RGB · HSL 코드를 한 번에 확인하세요.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "색상 코드 추출기",
    "description": "색을 선택하거나 화면에서 직접 뽑아 HEX · RGB · HSL 코드를 한 번에 확인하세요.",
    "applicationCategory": "UtilitiesApplication",
    "inLanguage": "ko",
    "operatingSystem": "Any"
  }
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
  <style>
    :root {
      --bg: #F5F5F3;
      --text: #1A1A1A;
      --text-sub: #666;
      --border: #D8D8D8;
      --card-bg: #FFFFFF;
      --card-border: #E4E4E4;
      --copy-ok: #2D7A4F;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 1rem;
    }
    main { max-width: 480px; margin: 0 auto; padding: 1.5rem 0 3rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.4rem; }
    .hero-line {
      width: 2.5rem; height: 2px;
      background: var(--text);
      margin: 0.5rem 0 1.5rem;
    }
    .subtitle { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 1.75rem; }

    /* Swatch */
    .swatch-wrap {
      display: flex;
      gap: 0.75rem;
      align-items: stretch;
      margin-bottom: 1.25rem;
    }
    .swatch-box {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      flex-shrink: 0;
      overflow: hidden;
      background: #4A90D9;
      transition: box-shadow 150ms;
    }
    .swatch-box:hover { box-shadow: 0 0 0 3px rgba(0,0,0,0.12); }
    .swatch-box input[type="color"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
      padding: 0;
    }
    .swatch-hint {
      font-size: 0.68rem;
      text-align: center;
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      pointer-events: none;
    }

    .swatch-actions { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .btn-pick {
      flex: 1;
      padding: 0 1rem;
      font-size: 0.875rem;
      font-family: inherit;
      font-weight: 600;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 120ms;
    }
    .btn-pick:hover { background: #EBEBEB; }
    .btn-pick:disabled { opacity: 0.38; cursor: not-allowed; }

    /* HEX direct input */
    .hex-input-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }
    .hex-input-wrap label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.04em;
      width: 2.5rem;
      flex-shrink: 0;
    }
    #hexDirect {
      flex: 1;
      font-family: 'SF Mono', 'Consolas', 'Pretendard', monospace;
      font-size: 1rem;
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #hexDirect:focus { outline: 2px solid #555; outline-offset: 1px; }

    /* Code outputs */
    .codes {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .code-row {
      display: flex;
      align-items: center;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--card-border);
      gap: 0.75rem;
    }
    .code-row:last-child { border-bottom: none; }
    .code-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-sub);
      width: 2.5rem;
      flex-shrink: 0;
      letter-spacing: 0.06em;
    }
    .code-val {
      flex: 1;
      font-family: 'SF Mono', 'Consolas', 'Pretendard', monospace;
      font-size: 0.95rem;
      color: var(--text);
    }
    .btn-copy {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.28rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-sub);
      cursor: pointer;
      transition: background 100ms, color 100ms, border-color 100ms;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-copy:hover { background: #E0E0E0; }
    .btn-copy.ok { background: var(--copy-ok); color: #fff; border-color: var(--copy-ok); }

    /* Recent */
    .recent-wrap { display: none; }
    .recent-label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-bottom: 0.5rem; }
    .recent-list { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .recent-chip {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: transform 120ms, box-shadow 120ms;
      flex-shrink: 0;
    }
    .recent-chip:hover { transform: scale(1.12); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

    /* Eyedropper notice */
    #eyedropNotice {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: -0.25rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
<main>
  <h1>색상 코드 추출기</h1>
  <div class="hero-line"></div>
  <p class="subtitle">색을 선택하거나 화면에서 직접 뽑아 HEX · RGB · HSL 코드를 확인하세요.</p>

  <div class="swatch-wrap">
    <div class="swatch-box" id="swatchBox">
      <input type="color" id="colorInput" value="#4A90D9" aria-label="색상 선택">
      <span class="swatch-hint" id="swatchHint">클릭해서 선택</span>
    </div>
    <div class="swatch-actions">
      <button class="btn-pick" id="eyedropBtn">화면에서 색 뽑기</button>
      <button class="btn-pick" id="randomBtn">랜덤 색상</button>
    </div>
  </div>

  <p id="eyedropNotice">※ 화면에서 색 뽑기는 Chrome · Edge에서만 지원됩니다.</p>

  <div class="hex-input-wrap">
    <label for="hexDirect">HEX</label>
    <input type="text" id="hexDirect" value="#4A90D9" maxlength="7" placeholder="#000000" spellcheck="false" autocomplete="off">
  </div>

  <div class="codes">
    <div class="code-row">
      <span class="code-label">HEX</span>
      <span id="hexVal" class="code-val">#4A90D9</span>
      <button class="btn-copy" data-target="hexVal">복사</button>
    </div>
    <div class="code-row">
      <span class="code-label">RGB</span>
      <span id="rgbVal" class="code-val">rgb(74, 144, 217)</span>
      <button class="btn-copy" data-target="rgbVal">복사</button>
    </div>
    <div class="code-row">
      <span class="code-label">HSL</span>
      <span id="hslVal" class="code-val">hsl(210, 65%, 57%)</span>
      <button class="btn-copy" data-target="hslVal">복사</button>
    </div>
  </div>

  <div class="recent-wrap" id="recentWrap">
    <p class="recent-label">최근 선택</p>
    <div id="recentList" class="recent-list"></div>
  </div>
</main>

<script>
(function () {
  var colorInput = document.getElementById('colorInput');
  var swatchBox  = document.getElementById('swatchBox');
  var swatchHint = document.getElementById('swatchHint');
  var eyedropBtn = document.getElementById('eyedropBtn');
  var randomBtn  = document.getElementById('randomBtn');
  var hexDirect  = document.getElementById('hexDirect');
  var hexVal     = document.getElementById('hexVal');
  var rgbVal     = document.getElementById('rgbVal');
  var hslVal     = document.getElementById('hslVal');
  var recentWrap = document.getElementById('recentWrap');
  var recentList = document.getElementById('recentList');
  var eyedropNotice = document.getElementById('eyedropNotice');
  var recent = [];

  if (!window.EyeDropper) {
    eyedropBtn.disabled = true;
    eyedropNotice.style.display = 'block';
  }

  function hexToRgb(hex) {
    return {
      r: parseInt(hex.slice(1, 3), 16),
      g: parseInt(hex.slice(3, 5), 16),
      b: parseInt(hex.slice(5, 7), 16)
    };
  }

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h, s, l = (max + min) / 2, d = max - min;
    if (d === 0) {
      h = s = 0;
    } else {
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r)      h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
      else if (max === g) h = ((b - r) / d + 2) / 6;
      else                h = ((r - g) / d + 4) / 6;
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
  }

  function applyColor(hex) {
    hex = hex.toUpperCase();
    var rgb = hexToRgb(hex);
    var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);

    swatchBox.style.background = hex;
    colorInput.value = hex.toLowerCase();
    hexDirect.value = hex;

    hexVal.textContent = hex;
    rgbVal.textContent = 'rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')';
    hslVal.textContent = 'hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)';

    // hint text color based on luminance
    var lum = 0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b;
    swatchHint.style.color = lum > 140 ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.8)';

    addRecent(hex);
  }

  function addRecent(hex) {
    if (recent[0] === hex) return;
    recent = [hex].concat(recent.filter(function (c) { return c !== hex; })).slice(0, 12);
    renderRecent();
  }

  function renderRecent() {
    if (recent.length <= 1) { recentWrap.style.display = 'none'; return; }
    recentWrap.style.display = '';
    recentList.innerHTML = '';
    recent.slice(1).forEach(function (hex) {
      var chip = document.createElement('button');
      chip.className = 'recent-chip';
      chip.style.background = hex;
      chip.title = hex;
      chip.setAttribute('aria-label', hex + ' 선택');
      chip.addEventListener('click', function () { applyColor(hex); });
      recentList.appendChild(chip);
    });
  }

  colorInput.addEventListener('input', function () {
    applyColor(colorInput.value);
  });

  hexDirect.addEventListener('input', function () {
    var v = hexDirect.value.trim();
    if (!v.startsWith('#')) v = '#' + v;
    if (/^#[0-9A-Fa-f]{6}$/.test(v)) applyColor(v);
  });
  hexDirect.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') hexDirect.blur();
  });

  eyedropBtn.addEventListener('click', function () {
    if (!window.EyeDropper) return;
    new EyeDropper().open().then(function (r) {
      applyColor(r.sRGBHex);
    }).catch(function () {});
  });

  randomBtn.addEventListener('click', function () {
    var n = Math.floor(Math.random() * 0xFFFFFF);
    applyColor('#' + n.toString(16).padStart(6, '0'));
  });

  document.querySelectorAll('.btn-copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var text = document.getElementById(btn.dataset.target).textContent;
      navigator.clipboard.writeText(text).then(function () {
        btn.textContent = '✓';
        btn.classList.add('ok');
        setTimeout(function () {
          btn.textContent = '복사';
          btn.classList.remove('ok');
        }, 1500);
      });
    });
  });

  applyColor('#4A90D9');
}());
</script>
</body>
</html>
