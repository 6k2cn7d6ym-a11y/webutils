<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 여름 황금연차 계산기 — 광복절·추석 최대 연휴 만들기</title>
  <meta name="description" content="2026년 하반기 광복절·추석·개천절·한글날·크리스마스 공휴일 일정으로 연차 몇 일 쓰면 며칠 쉴 수 있는지 즉시 계산해드립니다.">
  <meta property="og:title" content="2026 황금연차 계산기 — 광복절·추석 최대 연휴 조합">
  <meta property="og:description" content="남은 연차 입력 → 2026 하반기 공휴일별 최적 연휴 조합 즉시 확인">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://utils.minon.kr/golden-vacation-planner-2026/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="2026 황금연차 계산기">
  <meta name="twitter:description" content="연차 몇 일로 며칠 쉴 수 있는지 즉시 확인">
  <link rel="canonical" href="https://utils.minon.kr/golden-vacation-planner-2026/">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "2026 여름 황금연차 계산기",
    "description": "2026년 하반기 공휴일 일정으로 최소 연차로 최대 연휴를 만드는 조합을 계산하는 계산기",
    "url": "https://utils.minon.kr/golden-vacation-planner-2026/",
    "applicationCategory": "UtilitiesApplication",
    "inLanguage": "ko",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #1a1a1a;
      background: #f4f4f4;
      padding: 1rem;
    }
    main { max-width: 520px; margin: 0 auto; }
    header { margin-bottom: 1.25rem; }
    h1 { font-size: 1.4rem; font-weight: 700; }
    .subtitle { font-size: 0.875rem; color: #666; margin-top: 0.2rem; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #333;
    }
    .input-row { display: flex; align-items: center; gap: 0.5rem; }
    input[type="number"] {
      padding: 0.65rem 0.75rem;
      border: 1.5px solid #d4d4d4;
      border-radius: 7px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a1a;
      width: 100px;
      -webkit-appearance: none;
      appearance: none;
      background: #fff;
      text-align: center;
    }
    input[type="number"]:focus { outline: none; border-color: #2563eb; }
    .unit { font-size: 0.95rem; color: #555; }
    .error { color: #dc2626; font-size: 0.8rem; margin-top: 0.35rem; display: none; }
    .error.show { display: block; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 0.4rem; }
    /* Event cards */
    .event-card {
      border-radius: 10px;
      border: 2px solid #e5e5e5;
      margin-bottom: 1rem;
      overflow: hidden;
      background: #fff;
    }
    .event-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #f0f0f0;
    }
    .event-icon { font-size: 1.5rem; line-height: 1; }
    .event-title { font-size: 1rem; font-weight: 700; }
    .event-date { font-size: 0.8rem; color: #888; margin-top: 0.1rem; }
    .scenarios { padding: 0.75rem 1rem; }
    .scenario-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid #f5f5f5;
      opacity: 1;
      transition: opacity 0.2s;
    }
    .scenario-row:last-child { border-bottom: none; }
    .scenario-row.dimmed { opacity: 0.3; }
    .scenario-row.highlight { background: #eff6ff; margin: 0 -1rem; padding: 0.55rem 1rem; border-radius: 6px; }
    .leave-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 0.25rem 0.5rem;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .lb-zero { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .lb-low  { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .lb-mid  { background: #fefce8; color: #7c4a00; border: 1px solid #fde68a; }
    .lb-high { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .scenario-info { min-width: 0; }
    .scenario-period { font-size: 0.85rem; font-weight: 600; color: #222; }
    .scenario-desc { font-size: 0.78rem; color: #777; margin-top: 0.05rem; }
    .days-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      padding: 0.3rem 0.5rem;
      background: #f0f0f0;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #333;
      white-space: nowrap;
    }
    .days-badge.best { background: #2563eb; color: #fff; }
    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.25rem; }
    .disclaimer {
      font-size: 0.8rem;
      color: #777;
      background: #f9f9f9;
      border-radius: 7px;
      padding: 0.85rem 1rem;
      border-left: 3px solid #e0e0e0;
      margin-bottom: 1rem;
    }
    #ad-slot { min-height: 50px; margin-bottom: 1rem; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>2026 황금연차 계산기</h1>
    <p class="subtitle">광복절·추석·한글날·크리스마스 — 최소 연차로 최대 연휴 만들기</p>
  </header>

  <div class="card">
    <label for="leaveInput">남은 연차 일수</label>
    <div class="input-row">
      <input type="number" id="leaveInput" min="0" max="99" step="1" placeholder="0" value="">
      <span class="unit">일</span>
    </div>
    <span class="error" id="leaveErr" role="alert">0~99 사이 숫자를 입력해주세요</span>
    <p class="hint">입력하면 사용 가능한 시나리오만 강조됩니다. 입력 없이도 전체 확인 가능.</p>
  </div>

  <div id="ad-slot"></div>

  <div class="legend">
    <span class="legend-item"><span class="leave-badge lb-zero">연차 0일</span> 연차 없이 가능</span>
    <span class="legend-item"><span class="leave-badge lb-low">연차 1~2일</span> 소량</span>
    <span class="legend-item"><span class="leave-badge lb-mid">연차 3~4일</span> 중간</span>
    <span class="legend-item"><span class="leave-badge lb-high">연차 5일+</span> 넉넉히</span>
  </div>

  <div id="eventsContainer"></div>

  <p class="disclaimer">
    ⚠️ 2026년 추석은 9월 25일(금)로 계산했습니다. 대체공휴일 지정 여부는 정부 공식 관보를 확인하세요. 회사별 연차 규정·반차 정책이 다를 수 있으니 인사팀 확인을 권장합니다.
  </p>
</main>

<script>
(function () {
  'use strict';

  var EVENTS = [
    {
      icon: '🇰🇷',
      title: '광복절',
      dateInfo: '8월 15일(토) + 대체공휴일 8월 17일(월)',
      scenarios: [
        {
          leave: 1,
          days: 4,
          period: '8/14(금) ~ 8/17(월)',
          desc: '금 연차 1일 → 광복절·일·대체공휴일 연결'
        },
        {
          leave: 2,
          days: 5,
          period: '8/13(목) ~ 8/17(월)',
          desc: '목·금 연차 2일 → 5일 연속'
        },
        {
          leave: 5,
          days: 10,
          period: '8/8(토) ~ 8/17(월)',
          desc: '8/10~14 연차 5일 → 앞 주말 포함 10일 연속'
        }
      ]
    },
    {
      icon: '🌕',
      title: '추석',
      dateInfo: '추석 연휴 9/24(목)~9/26(토) + 대체공휴일 9/28(월)',
      scenarios: [
        {
          leave: 0,
          days: 5,
          period: '9/24(목) ~ 9/28(월)',
          desc: '연차 없이 추석 연휴 + 대체공휴일 5일'
        },
        {
          leave: 1,
          days: 6,
          period: '9/23(수) ~ 9/28(월)',
          desc: '수 연차 1일 추가 → 6일 연속'
        },
        {
          leave: 2,
          days: 7,
          period: '9/22(화) ~ 9/28(월)',
          desc: '화·수 연차 2일 추가 → 7일 연속'
        }
      ]
    },
    {
      icon: '🍁',
      title: '개천절 + 한글날 황금연휴',
      dateInfo: '개천절 대체(10/5 월) + 한글날(10/9 금) 동시 활용',
      scenarios: [
        {
          leave: 1,
          days: 4,
          period: '10/2(금) ~ 10/5(월)',
          desc: '금 연차 1일 → 개천절 대체공휴일과 연결'
        },
        {
          leave: 3,
          days: 9,
          period: '10/3(토) ~ 10/11(일)',
          desc: '10/6·7·8 연차 3일 → 개천절+한글날 잇는 9일 연속!'
        },
        {
          leave: 5,
          days: 11,
          period: '10/1(목) ~ 10/11(일)',
          desc: '10/1·2·6·7·8 연차 5일 → 개천절·한글날 모두 묶어 11일!'
        }
      ]
    },
    {
      icon: '🎄',
      title: '크리스마스',
      dateInfo: '12월 25일(금)',
      scenarios: [
        {
          leave: 0,
          days: 3,
          period: '12/25(금) ~ 12/27(일)',
          desc: '연차 없이 금~일 3일'
        },
        {
          leave: 2,
          days: 5,
          period: '12/24(목) ~ 12/28(월)',  // [클레버 수정: 요일 오타 정정 · 2026-12-24 = 목 (실제 캘린더 대조)]
          desc: '12/24·28 연차 2일 → 5일 연속'
        },
        {
          leave: 4,
          days: 7,
          period: '12/22(화) ~ 12/28(월)',  // [클레버 수정: 요일 오타 정정 · 2026-12-22 = 화 (실제 캘린더 대조)]
          desc: '12/22·23·24·28 연차 4일 → 7일 연속'
        }
      ]
    }
  ];

  function leaveBadgeClass(n) {
    if (n === 0) return 'lb-zero';
    if (n <= 2)  return 'lb-low';
    if (n <= 4)  return 'lb-mid';
    return 'lb-high';
  }

  function leaveLabel(n) {
    if (n === 0) return '연차 0일';
    return '연차 ' + n + '일';
  }

  function renderEvents(maxLeave) {
    var container = document.getElementById('eventsContainer');
    container.innerHTML = '';

    EVENTS.forEach(function (ev) {
      var card = document.createElement('div');
      card.className = 'event-card';

      var header = document.createElement('div');
      header.className = 'event-header';
      header.innerHTML =
        '<span class="event-icon" aria-hidden="true">' + ev.icon + '</span>' +
        '<div>' +
          '<div class="event-title">' + ev.title + '</div>' +
          '<div class="event-date">' + ev.dateInfo + '</div>' +
        '</div>';
      card.appendChild(header);

      var scenarios = document.createElement('div');
      scenarios.className = 'scenarios';

      // 해당 이벤트에서 연차 조건 내 최고 days 찾기
      var bestDays = 0;
      if (maxLeave !== null) {
        ev.scenarios.forEach(function (s) {
          if (s.leave <= maxLeave && s.days > bestDays) bestDays = s.days;
        });
      }

      ev.scenarios.forEach(function (s) {
        var row = document.createElement('div');
        row.className = 'scenario-row';

        var canUse  = maxLeave === null || s.leave <= maxLeave;
        var isBest  = maxLeave !== null && canUse && s.days === bestDays;

        if (!canUse) row.classList.add('dimmed');
        if (isBest)  row.classList.add('highlight');

        var daysHtml = '<span class="days-badge' + (isBest ? ' best' : '') + '">' + s.days + '일</span>';

        row.innerHTML =
          '<span class="leave-badge ' + leaveBadgeClass(s.leave) + '">' + leaveLabel(s.leave) + '</span>' +
          '<div class="scenario-info">' +
            '<div class="scenario-period">' + s.period + '</div>' +
            '<div class="scenario-desc">' + s.desc + '</div>' +
          '</div>' +
          daysHtml;

        scenarios.appendChild(row);
      });

      card.appendChild(scenarios);
      container.appendChild(card);
    });
  }

  // 초기 렌더링 (필터 없음)
  renderEvents(null);

  // 연차 입력 이벤트
  var leaveInput = document.getElementById('leaveInput');
  var leaveErr   = document.getElementById('leaveErr');

  leaveInput.addEventListener('input', function () {
    var raw = leaveInput.value.trim();
    leaveErr.classList.remove('show');

    if (raw === '') {
      renderEvents(null);
      return;
    }

    var val = parseInt(raw, 10);
    if (isNaN(val) || val < 0 || val > 99) {
      leaveErr.classList.add('show');
      renderEvents(null);
      return;
    }

    renderEvents(val);
  });
}());
</script>
</body>
</html>
