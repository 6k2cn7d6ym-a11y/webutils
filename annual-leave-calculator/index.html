<head>

  <meta property="og:title" content="2026 연차 계산기">

  <style>
    :root {
      --primary: #0FADAD;
      --primary-hover: #0D8B8B;
      --primary-soft: #D6F5F5;
      --primary-soft-border: #A8E5E5;
      --primary-tint: #ECFAFA;
      --danger: #dc3545;
      --holiday-bg: #fff3cd;
      --holiday-border: #ffc107;
      --holiday-text: #856404;
      --alt-bg: #d1ecf1;
      --alt-text: #0c5460;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #212529;
      --text-sub: #6c757d;
      --text-mute: #495057;
      --border: #dee2e6;
      --border-soft: #e9ecef;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 1rem; }

    header { text-align: center; padding: 2rem 1rem 1rem; }
    header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .hero-line { width: 2.5rem; height: 2px; background: var(--primary); margin: 0.5rem auto 0.75rem; border-radius: 2px; }
    header p { color: var(--text-sub); font-size: 0.95rem; }

    .calendar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .cal-header {
      background: var(--primary);
      color: #fff;
      text-align: center;
      padding: 0.6rem 0.75rem;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cal-nav-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 0.5rem;
      line-height: 1;
      opacity: 0.85;
      font-family: inherit;
    }
    .cal-nav-btn:hover { opacity: 1; }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: default; }
    .cal-guide {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      color: var(--text-sub);
      background: var(--primary-tint);
      border-bottom: 1px solid var(--primary-soft-border);
      min-height: 2.2rem;
    }
    .reset-btn {
      display: none;
      font-size: 0.78rem;
      color: var(--text-sub);
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      cursor: pointer;
      font-family: inherit;
      line-height: 1.4;
    }
    .reset-btn:hover { color: var(--danger); border-color: var(--danger); }
    .reset-btn.show { display: inline-block; }
    .cal-weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .cal-wday { text-align: center; padding: 0.45rem 0; font-size: 0.8rem; font-weight: 600; color: var(--text-sub); }
    .cal-wday.sun { color: var(--danger); }
    .cal-days-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-cell {
      text-align: center;
      padding: 0.5rem 0.15rem;
      font-size: 0.9rem;
      border-bottom: 1px solid #f0f0f0;
      min-height: 3.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
      transition: background 0.1s ease;
      position: relative;
      cursor: pointer;
    }
    .cal-cell.empty { background: #fafafa; cursor: default; }
    .cal-cell.sat .cal-date { color: var(--text-mute); }
    .cal-cell.sun .cal-date { color: var(--danger); }
    .cal-cell.holiday { background: var(--holiday-bg); }
    .cal-cell.holiday .cal-date { font-weight: 700; color: var(--holiday-text); }
    .cal-cell.alt-holiday { background: var(--alt-bg); }
    .cal-cell.alt-holiday .cal-date { font-weight: 700; color: var(--alt-text); }
    .cal-hl { font-size: 0.6rem; color: var(--holiday-text); line-height: 1.2; text-align: center; }
    .cal-hl.alt { color: var(--alt-text); }
    .cal-cell.today::before {
      content: '';
      position: absolute;
      top: 0.25rem; right: 0.25rem;
      width: 5px; height: 5px;
      background: var(--primary);
      border-radius: 50%;
    }
    .cal-cell:not(.empty):hover { background: var(--primary-tint) !important; }
    .cal-cell.selected-start,
    .cal-cell.selected-end { background: var(--primary) !important; }
    .cal-cell.selected-start .cal-date,
    .cal-cell.selected-end .cal-date { color: #fff !important; font-weight: 700; }
    .cal-cell.selected-start .cal-hl,
    .cal-cell.selected-end .cal-hl { color: rgba(255,255,255,0.8) !important; }
    .cal-cell.in-range { background: var(--primary-soft) !important; }
    .cal-cell.hover-range { background: rgba(13,173,173,0.1) !important; }

    .result-area { display: none; margin-bottom: 1rem; }
    .result-area.show { display: block; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-card {
      background: var(--card);
      border: 1px solid var(--primary-soft-border);
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .result-period { font-size: 0.88rem; color: var(--text-sub); margin-bottom: 0.5rem; }
    .result-big { font-size: 2.5rem; font-weight: 700; color: var(--primary); letter-spacing: -0.03em; line-height: 1.1; }
    .result-big .unit { font-size: 1rem; font-weight: 400; color: var(--text-sub); }
    .result-note { font-size: 0.88rem; color: var(--text-mute); margin-top: 0.25rem; }
    .day-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.75rem; }
    .day-tag { font-size: 0.75rem; padding: 0.15rem 0.45rem; border-radius: 4px; }
    .day-tag.weekend { background: var(--border-soft); color: var(--text-sub); }
    .day-tag.holiday-t { background: var(--holiday-bg); color: var(--holiday-text); }
    .day-tag.alt-t { background: var(--alt-bg); color: var(--alt-text); }
    .day-tag.leave { background: var(--primary-soft); color: var(--primary-hover); font-weight: 600; }

    .holiday-section { margin-top: 1.5rem; }
    details summary {
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--text-sub);
      padding: 0.4rem 0;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      user-select: none;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: '▶'; font-size: 0.6rem; transition: transform 0.2s; }
    details[open] summary::before { transform: rotate(90deg); }
    .holiday-list { margin-top: 0.6rem; display: grid; gap: 0.35rem; }
    .holiday-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .holiday-item .h-date { color: var(--text-sub); }
    .holiday-item .h-name { font-weight: 600; }
    .holiday-item.is-alt { border-color: var(--alt-bg); background: var(--alt-bg); }
    .holiday-item.is-alt .h-name { color: var(--alt-text); }
    .holiday-item.is-past { opacity: 0.4; }

    .disclaimer { font-size: 0.8rem; color: var(--text-sub); margin-top: 1.5rem; padding: 0.75rem 1rem; background: var(--bg); border-radius: 6px; border: 1px solid var(--border-soft); }
    footer { text-align: center; color: var(--text-sub); font-size: 0.8rem; padding: 2rem 1rem; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.25rem; }
      .cal-hl { font-size: 0.55rem; }
      .result-big { font-size: 2rem; }
      .cal-cell { min-height: 2.8rem; }
    }
  </style>
</head>
<body>

<script>
  var HOLIDAYS = {
    '2026-01-01': { name: '신정', type: 'holiday' },
    '2026-02-16': { name: '설날 전날', type: 'holiday' },
    '2026-02-17': { name: '설날', type: 'holiday' },
    '2026-02-18': { name: '설날 다음날', type: 'holiday' },
    '2026-03-01': { name: '삼일절', type: 'holiday' },
    '2026-03-02': { name: '대체공휴일(삼일절)', type: 'alt' },
    '2026-05-05': { name: '어린이날', type: 'holiday' },
    '2026-05-24': { name: '석가탄신일', type: 'holiday' },
    '2026-05-25': { name: '대체공휴일(석가탄신일)', type: 'alt' },
    '2026-06-06': { name: '현충일', type: 'holiday' },
    '2026-08-15': { name: '광복절', type: 'holiday' },
    '2026-08-17': { name: '대체공휴일(광복절)', type: 'alt' },
    '2026-09-23': { name: '추석 전날', type: 'holiday' },
    '2026-09-24': { name: '추석', type: 'holiday' },
    '2026-09-25': { name: '추석 다음날', type: 'holiday' },
    '2026-10-03': { name: '개천절', type: 'holiday' },
    '2026-10-05': { name: '대체공휴일(개천절)', type: 'alt' },
    '2026-10-09': { name: '한글날', type: 'holiday' },
    '2026-12-25': { name: '크리스마스', type: 'holiday' }
  };

  var MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var DNAMES = ['일','월','화','수','목','금','토'];

  var now = new Date();
  now.setHours(0, 0, 0, 0);
  var todayDs = fmtDs(now);

  var curYear = 2026;
  var curMonth = (now.getFullYear() === 2026) ? now.getMonth() : (now.getFullYear() < 2026 ? 0 : 11);

  var selStart = null, selEnd = null, hoverDs = null;

  function fmtDs(d) {
    var y = d.getFullYear(), m = d.getMonth() + 1, dd = d.getDate();
    return y + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
  }
  function parseDs(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }

  function updateNav() {
    document.getElementById('calTitle').textContent = curYear + '년 ' + MONTH_NAMES[curMonth];
    document.getElementById('prevBtn').disabled = (curMonth === 0);
    document.getElementById('nextBtn').disabled = (curMonth === 11);
  }

  function prevMonth() {
    if (curMonth === 0) return;
    curMonth--;
    buildCal();
    updateNav();
    refreshCells();
  }

  function nextMonth() {
    if (curMonth === 11) return;
    curMonth++;
    buildCal();
    updateNav();
    refreshCells();
  }

  function buildCal() {
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    grid.onmouseleave = function() { hoverDs = null; refreshCells(); };

    var firstDay = new Date(curYear, curMonth, 1).getDay();
    var daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

    for (var i = 0; i < firstDay; i++) {
      var b = document.createElement('div');
      b.className = 'cal-cell empty';
      grid.appendChild(b);
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var date = new Date(curYear, curMonth, d);
      var dow = date.getDay();
      var ds = fmtDs(date);
      var hol = HOLIDAYS[ds];

      var cell = document.createElement('div');
      var cls = 'cal-cell';
      if (ds === todayDs) cls += ' today';
      if (hol) {
        cls += (hol.type === 'alt') ? ' alt-holiday' : ' holiday';
      } else if (dow === 0) {
        cls += ' sun';
      } else if (dow === 6) {
        cls += ' sat';
      }
      cell.className = cls;
      cell.setAttribute('data-date', ds);

      var dateEl = document.createElement('span');
      dateEl.className = 'cal-date';
      dateEl.textContent = d;
      cell.appendChild(dateEl);

      if (hol) {
        var lbl = document.createElement('div');
        lbl.className = 'cal-hl' + (hol.type === 'alt' ? ' alt' : '');
        lbl.textContent = hol.name;
        cell.appendChild(lbl);
      }

      cell.addEventListener('click', (function(ds_) {
        return function() { handleClick(ds_); };
      })(ds));
      cell.addEventListener('mouseenter', (function(ds_) {
        return function() { handleHover(ds_); };
      })(ds));

      grid.appendChild(cell);
    }
  }

  function handleClick(ds) {
    if (!selStart || selEnd) {
      selStart = ds; selEnd = null; hoverDs = null;
      setGuide('picking');
    } else {
      if (ds === selStart) {
        selStart = null; selEnd = null;
        setGuide('idle'); refreshCells(); return;
      } else if (ds < selStart) {
        selEnd = selStart; selStart = ds;
      } else {
        selEnd = ds;
      }
      hoverDs = null;
      setGuide('done');
      showResult();
    }
    refreshCells();
  }

  function handleHover(ds) {
    if (selStart && !selEnd) { hoverDs = ds; refreshCells(); }
  }

  function resetSel() {
    selStart = null; selEnd = null; hoverDs = null;
    refreshCells(); setGuide('idle');
    var area = document.getElementById('resultArea');
    area.className = 'result-area'; area.innerHTML = '';
  }

  function setGuide(state) {
    var txt = document.getElementById('guideText');
    var btn = document.getElementById('resetBtn');
    if (state === 'idle') {
      txt.textContent = '시작일을 클릭하세요';
      btn.className = 'reset-btn';
    } else if (state === 'picking') {
      txt.textContent = '종료일을 클릭하세요 (다른 달로 이동 후 선택 가능)';
      btn.className = 'reset-btn show';
    } else {
      txt.textContent = '다시 선택하려면 달력을 클릭하세요';
      btn.className = 'reset-btn show';
    }
  }

  function refreshCells() {
    var effectiveEnd = selEnd || hoverDs;
    var rS = selStart, rE = effectiveEnd;
    if (rS && rE && rE < rS) { var tmp = rS; rS = rE; rE = tmp; }

    document.querySelectorAll('.cal-cell[data-date]').forEach(function(cell) {
      var ds = cell.getAttribute('data-date');
      cell.classList.remove('selected-start', 'selected-end', 'in-range', 'hover-range');
      if (!selEnd && ds === selStart) {
        cell.classList.add('selected-start');
      }
      if (selEnd) {
        if (ds === rS) cell.classList.add('selected-start');
        if (ds === rE) cell.classList.add('selected-end');
      }
      if (rS && rE && ds > rS && ds < rE) {
        cell.classList.add(selEnd ? 'in-range' : 'hover-range');
      }
    });
  }

  function showResult() {
    if (!selStart || !selEnd) return;
    var s = parseDs(selStart), e = parseDs(selEnd);
    var diff = Math.round((e - s) / 86400000) + 1;
    var leaveCount = 0, wkndCount = 0, holCount = 0, tags = [];

    for (var i = 0; i < diff; i++) {
      var cur = new Date(s.getTime() + i * 86400000);
      var ds = fmtDs(cur);
      var dow = cur.getDay();
      var hol = HOLIDAYS[ds];
      var lbl = (cur.getMonth()+1) + '/' + cur.getDate() + '(' + DNAMES[dow] + ')';

      if (hol) {
        holCount++;
        tags.push('<span class="day-tag ' + (hol.type === 'alt' ? 'alt-t' : 'holiday-t') + '">' + lbl + ' ' + hol.name + '</span>');
      } else if (dow === 0 || dow === 6) {
        wkndCount++;
        tags.push('<span class="day-tag weekend">' + lbl + '</span>');
      } else {
        leaveCount++;
        tags.push('<span class="day-tag leave">' + lbl + ' 연차</span>');
      }
    }

    var periodStr =
      (s.getMonth()+1) + '/' + s.getDate() + '(' + DNAMES[s.getDay()] + ') ~ ' +
      (e.getMonth()+1) + '/' + e.getDate() + '(' + DNAMES[e.getDay()] + ')';

    var area = document.getElementById('resultArea');
    area.innerHTML =
      '<div class="result-card">' +
        '<div class="result-period">' + periodStr + ' · 총 ' + diff + '일 연속</div>' +
        '<div class="result-big">' + leaveCount + '<span class="unit">일 연차 필요</span></div>' +
        '<div class="result-note">주말 ' + wkndCount + '일 + 공휴일 ' + holCount + '일 포함</div>' +
        '<div class="day-tags">' + tags.join('') + '</div>' +
      '</div>';
    area.className = 'result-area show';
  }

  function buildHolidayList() {
    var list = document.getElementById('holidayList');
    Object.keys(HOLIDAYS).sort().forEach(function(ds) {
      var hol = HOLIDAYS[ds];
      var date = parseDs(ds);
      var dow = date.getDay();
      var isPast = ds < todayDs;
      var item = document.createElement('div');
      item.className = 'holiday-item' +
        (hol.type === 'alt' ? ' is-alt' : '') +
        (isPast ? ' is-past' : '');
      var dateStr = (date.getMonth()+1) + '월 ' + date.getDate() + '일(' + DNAMES[dow] + ')';
      item.innerHTML =
        '<span class="h-date">' + dateStr + '</span>' +
        '<span class="h-name">' + hol.name + '</span>';
      list.appendChild(item);
    });
  }

  updateNav();
  buildCal();
  buildHolidayList();
</script>
</body>
</html>
