  <style>
    :root {
      --bg: #F6F8F5;
      --primary: #2C5F3E;
      --primary-hover: #1E4B2E;
      --card-bg: #E8F0E9;
      --card-border: #BDD4BF;
      --text: #111C17;
      --text-sub: #5A7060;
      --border: #B8CCB9;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      padding: 1rem;
    }
    main { max-width: 580px; margin: 0 auto; padding: 2rem 0 4rem; }
    .back-link {
      display: inline-block;
      font-size: 0.875rem;
      color: var(--text-sub);
      text-decoration: none;
      margin-bottom: 1.75rem;
    }
    .back-link:hover { color: var(--primary); }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .hero-line {
      width: 2.5rem;
      height: 2px;
      background: var(--primary);
      margin: 0.5rem 0 1.5rem;
    }
    .subtitle { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 2rem; }
    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
    }
    .contact-card h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--primary);
    }
    .email-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      word-break: break-all;
    }
    .email-link:hover { text-decoration: underline; }
    .meta { font-size: 0.875rem; color: var(--text-sub); margin-top: 0.5rem; }
    .sla-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-top: 0.75rem;
    }
    .sla-table th {
      text-align: left;
      font-weight: 600;
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid var(--card-border);
      color: var(--text);
    }
    .sla-table td {
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid var(--card-border);
      color: var(--text-sub);
    }
    .sla-table tr:last-child td { border-bottom: none; }
    .topic-list {
      list-style: none;
      padding: 0;
      margin-top: 0.5rem;
    }
    .topic-list li {
      padding: 0.3rem 0;
      font-size: 0.9rem;
      color: var(--text-sub);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .topic-list li:last-child { border-bottom: none; }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }
    .privacy-note {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-top: 1.5rem;
    }
    .privacy-note a { color: var(--primary); }
    footer {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-sub);
      text-align: center;
    }
    footer a { color: var(--text-sub); }
  </style>
